<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1304 임채현 - 익산시 실시간 기상 정보</title>
    <style>
        /* 배경 디자인: 시원한 하늘색 그라데이션 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2c3e50;
        }

        /* 메인 카드: 투명도 있는 유리 느낌 (Glassmorphism) */
        .weather-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #1e3799;
        }

        .student-id {
            font-size: 18px;
            font-weight: bold;
            color: #4a69bd;
            margin-bottom: 30px;
        }

        /* 정보 섹션 배치 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.5);
            padding: 15px;
            border-radius: 15px;
        }

        .label {
            font-size: 13px;
            color: #7f8c8d;
            display: block;
            margin-bottom: 5px;
        }

        .value {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* 날씨 상세 테이블 */
        .weather-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-bottom: 20px;
        }

            font-size: 14
