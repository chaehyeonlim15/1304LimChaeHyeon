<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1304 임채현 - 익산시 실시간 기상 정보</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #3498db;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; font-size: 1.1em; }
        .temp { font-size: 3.5em; font-weight: bold; color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <h1>1304 임채현</h1>
        <p class="subtitle">익산시 실시간 기상 정보</p>
        <div class="temp">22°C</div>
        <p>현재 날씨: 맑음</p>
    </div>
</body>
</html>
